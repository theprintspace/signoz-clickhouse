name: Deploy to staging

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

# Per-service deploy workflow for signoz-clickhouse (staging) — first
# SigNoz custom-build rollout. Builds the Dockerfile here, pushes to
# ghcr.io/theprintspace/signoz-clickhouse:<sha>, then points the Railway
# `clickhouse` service at the new image and triggers a deploy via inline
# GraphQL calls (no cross-repo composite action — this repo is public and
# wouldn't have a runner-token with read access to the private
# infrastructure repo).
#
# IMPORTANT: After the first push, the GHCR package will be private by
# default. Flip it to PUBLIC manually once via the UI:
#   https://github.com/orgs/theprintspace/packages/container/signoz-clickhouse/settings
#   → Danger Zone → Change visibility → Public
# Then re-run this workflow — Railway will be able to pull without
# registry credentials. (Alternative: store a GHCR PAT at
# 1P `ghcr/read-token` and we'll wire registry-credentials in.)
#
# cluster.xml hardcodes zookeeper.railway.internal:2181 and
# clickhouse.railway.internal:9000 — relies on the bare service names in
# Railway. Internal-only on tps-staging Railway project.
#
# Volume: clickhouse-volume @ /var/lib/clickhouse (50GB, bootstrap-managed).
#
# Required setup:
#   1. Repo secret OP_SERVICE_ACCOUNT_TOKEN — staging SA from Engineering
#      vault → "Service Account Auth Token: infrastructure staging service
#      account", field `credential`.
#   2. 1Password vault `tps-infra-staging` items (already populated by
#      bootstrap-railway.ps1):
#        railway/api-token
#        railway/project-id
#        railway/environment-id
#        railway/services/clickhouse

env:
  IMAGE_REPO: ghcr.io/theprintspace/signoz-clickhouse
  RAILWAY_GRAPHQL: https://backboard.railway.com/graphql/v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load Railway secrets from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          VAULT='tps-infra-staging'

          read_secret() {
            local title="$1"
            local val
            val=$(op item get "$title" --vault "$VAULT" --fields password --reveal 2>/dev/null || true)
            if [ -z "$val" ]; then
              echo "::error::Required vault item '$title' missing or empty in $VAULT" >&2
              return 1
            fi
            echo "$val"
          }

          RAILWAY_TOKEN=$(read_secret 'railway/api-token')
          PROJECT_ID=$(read_secret 'railway/project-id')
          ENVIRONMENT_ID=$(read_secret 'railway/environment-id')
          SERVICE_ID=$(read_secret 'railway/services/clickhouse')

          echo "::add-mask::$RAILWAY_TOKEN"

          {
            echo "RAILWAY_TOKEN=$RAILWAY_TOKEN"
            echo "PROJECT_ID=$PROJECT_ID"
            echo "ENVIRONMENT_ID=$ENVIRONMENT_ID"
            echo "SERVICE_ID=$SERVICE_ID"
          } >> "$GITHUB_ENV"

      - name: Sync env vars to Railway
        run: |
          set -euo pipefail
          # CLICKHOUSE_USER=default is required to disable the upstream
          # entrypoint's auto-restriction that writes
          # /etc/clickhouse-server/users.d/default-user.xml limiting the
          # default user to localhost-only. Without it, otel-collector
          # can't connect from clickhouse.railway.internal:9000 — only
          # 127.0.0.1 connections are allowed and migrations time out
          # waiting for sync. The override file written by the entrypoint
          # has higher precedence than our /etc/clickhouse-server/users.xml.
          ENVVARS=$(jq -nc '{ CLICKHOUSE_USER: "default" }')

          VARS_GQL=$(echo "$ENVVARS" | jq -r '
            to_entries | map(
              (.key | gsub("\""; "\\\"")) + ": " +
              (.value | tojson)
            ) | join(", ")
          ')

          body=$(jq -nc \
            --arg pid "$PROJECT_ID" --arg eid "$ENVIRONMENT_ID" --arg sid "$SERVICE_ID" \
            --arg vars "$VARS_GQL" \
            '{query: "mutation { variableCollectionUpsert(input: { projectId: \"\($pid)\", environmentId: \"\($eid)\", serviceId: \"\($sid)\", replace: false, variables: { \($vars) } }) }"}')
          response=$(curl -fsS -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" -d "$body")
          if echo "$response" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::variableCollectionUpsert: $(echo "$response" | jq -r '.errors[0].message')"
            exit 1
          fi
          echo "::notice::Synced $(echo "$ENVVARS" | jq 'length') env vars"

      - name: Update Railway service source + trigger deploy
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
        run: |
          set -euo pipefail

          # Step 1: serviceInstanceUpdate — point service at the new image.
          source_input=$(jq -nc --arg img "$IMAGE" '{image: $img}')
          input_obj=$(jq -nc --argjson src "$source_input" '{source: $src}')
          body=$(jq -nc \
            --arg eid "$ENVIRONMENT_ID" --arg sid "$SERVICE_ID" \
            --argjson input "$input_obj" \
            '{
              query: "mutation($eid: String!, $sid: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $eid, serviceId: $sid, input: $input) }",
              variables: { eid: $eid, sid: $sid, input: $input }
            }')
          response=$(curl -fsS -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          if echo "$response" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::serviceInstanceUpdate: $(echo "$response" | jq -r '.errors[0].message')"
            exit 1
          fi
          echo "::notice::Updated source → $IMAGE"

          # Step 2: serviceInstanceDeploy — explicit deploy trigger so identical-image
          # pushes still cycle the container if env vars or other config changed.
          body=$(jq -nc \
            --arg eid "$ENVIRONMENT_ID" --arg sid "$SERVICE_ID" \
            '{query: "mutation { serviceInstanceDeploy(environmentId: \"\($eid)\", serviceId: \"\($sid)\") }"}')
          response=$(curl -fsS -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          if echo "$response" | jq -e '.errors' > /dev/null 2>&1; then
            msg=$(echo "$response" | jq -r '.errors[0].message')
            echo "::warning::serviceInstanceDeploy: $msg (likely already deploying — non-fatal)"
          else
            echo "::notice::Deploy triggered for $SERVICE_ID"
          fi
